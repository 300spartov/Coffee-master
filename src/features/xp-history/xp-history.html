
<!-- XP history -->
<div class="overlay" id="ov-xp-history" onclick="if(event.target===this)closeOv('ov-xp-history')">
  <div class="sheet" style="max-height:80vh;overflow-y:auto">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:15px;padding-bottom:13px;border-bottom:1px solid var(--line-soft)">
      <div class="sheet-title" style="margin-bottom:0">Історія XP</div>
      <button onclick="closeOv('ov-xp-history')" style="background:none;border:none;cursor:pointer;color:var(--txt3);font-size:22px;line-height:1;padding:2px"><i class="ti ti-x" aria-hidden="true"></i></button>
    </div>
    <div id="xp-history-list"></div>
  </div>
</div>
