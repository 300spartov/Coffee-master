
<!-- ov-trash: Видалені рецепти -->
<div class="overlay" id="ov-trash" onclick="if(event.target===this)closeOv('ov-trash')">
  <div class="sheet" style="max-height:80vh;overflow-y:auto">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:15px;padding-bottom:13px;border-bottom:1px solid var(--line-soft)">
      <div class="sheet-title" style="margin-bottom:0">Видалені рецепти</div>
      <button onclick="closeOv('ov-trash')" style="background:none;border:none;cursor:pointer;color:var(--txt3);font-size:22px;line-height:1;padding:2px"><i class="ti ti-x" aria-hidden="true"></i></button>
    </div>
    <div style="font-family:var(--mono);font-size:9.5px;color:var(--txt3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px">Зберігаються 30 днів · потім видаляються назавжди</div>
    <div id="trash-list"></div>
  </div>
</div>
