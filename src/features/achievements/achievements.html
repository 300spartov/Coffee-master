<!-- АЧІВКИ -->
<div class="scr" id="scr-ach">
  <div class="hdr">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="back-btn" onclick="showScr('scr-profile')" style="width:36px;height:36px;border-radius:10px;background:#1a1d21;border:1px solid var(--line-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--txt2);font-size:18px;flex-shrink:0"><i class="ti ti-arrow-left" aria-hidden="true"></i></button>
      <div><div class="hdr-title" data-i18n="ach_title">Ачівки</div><div class="hdr-sub"><span id="ach-earned-count">0</span> / <span id="ach-total-count">0</span> <span data-i18n="ach_received">отримано</span></div></div>
    </div>
    <i class="ti ti-trophy" style="font-size:20px;color:var(--copper-lt)" aria-hidden="true"></i>
  </div>
  <div class="ach-hero">
    <div class="ach-hero-ic"><i class="ti ti-trophy" aria-hidden="true"></i></div>
    <div class="ach-hero-body">
      <div class="ach-hero-v"><span id="hero-earned">0</span><small> / <span id="hero-total">0</span></small></div>
      <div class="ach-hero-l">ачівок зібрано</div>
      <div class="ach-hero-track"><div class="ach-hero-fill" id="hero-fill" style="width:0%"></div></div>
    </div>
  </div>
  <div id="ach-scr" style="padding-bottom:20px"></div>
</div>
