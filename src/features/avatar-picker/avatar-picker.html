

<!-- Avatar picker -->
<div class="av-picker-overlay" id="av-picker" onclick="if(event.target===this)closeAvPicker()">
  <div class="av-picker-sheet">
    <div class="av-picker-title">Аватар профілю</div>
    <div class="av-emoji-grid" id="av-emoji-grid"></div>
    <div style="font-family:var(--mono);font-size:9px;color:var(--txt3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px;text-align:center">Колір фону</div>
    <div class="av-color-row" id="av-color-row"></div>
    <button class="av-close-btn" onclick="closeAvPicker()">Готово</button>
  </div>

</div>
