<div class="overlay" id="ov-bbean" onclick="if(event.target===this)closeOv('ov-bbean')">
  <div class="sheet">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:15px;padding-bottom:13px;border-bottom:1px solid var(--line-soft)">
      <div class="sheet-title" style="margin:0;padding:0;border:none">Вибери зерно</div>
      <button onclick="toggleInlineAdd('bean')" id="btn-add-bean" style="background:linear-gradient(160deg,var(--copper-lt),var(--copper));color:#1c130a;border:none;border-radius:10px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px"><i class="ti ti-plus" aria-hidden="true"></i> Додати</button>
    </div>
    <!-- Inline add form (hidden by default) -->
    <div id="inline-add-bean" style="display:none;background:#0f1011;border:1px solid var(--copper-dk);border-radius:12px;padding:14px;margin-bottom:14px">
      <div class="field-lbl" style="margin-bottom:6px;color:var(--copper-lt)">Нова пачка</div>
      <div class="ac-wrap" style="margin-bottom:8px">
        <input class="sfi" id="ib-name" placeholder="Назва кави" autocomplete="off" style="margin:0" oninput="acSuggest('ib-name','beanNames')" onfocus="acSuggest('ib-name','beanNames')">
        <div class="ac-drop" id="ac-ib-name"></div>
      </div>
      <div class="ac-wrap" style="margin-bottom:8px">
        <input class="sfi" id="ib-roast" placeholder="Обсмажувач" autocomplete="off" style="margin:0" oninput="acSuggest('ib-roast','roasters')" onfocus="acSuggest('ib-roast','roasters')">
        <div class="ac-drop" id="ac-ib-roast"></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
        <div class="ac-wrap">
          <input class="sfi" id="ib-country" placeholder="Країна" autocomplete="off" style="margin:0" oninput="acSuggest('ib-country','countries')" onfocus="acSuggest('ib-country','countries')">
          <div class="ac-drop" id="ac-ib-country"></div>
        </div>
        <select class="sfi" id="ib-process" style="margin:0">
          <option value="">Обробка</option>
          <option>Washed</option><option>Natural</option><option>Honey</option><option>Anaerobic</option>
        </select>
      </div>
      <div style="display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-bottom:10px">
        <input class="sfi" id="ib-desc" placeholder="Дескриптори" style="margin:0">
        <input class="sfi" id="ib-weight" type="number" value="250" placeholder="г" style="margin:0;font-weight:700">
      </div>
      <div style="display:flex;gap:8px">
        <button onclick="toggleInlineAdd('bean')" style="flex:1;background:#222;border:1px solid var(--line);border-radius:9px;padding:9px;font-size:12px;color:var(--txt2);cursor:pointer;font-family:inherit">Скасувати</button>
        <button onclick="addBeanInline()" style="flex:2;background:linear-gradient(160deg,var(--copper-lt),var(--copper));color:#1c130a;border:none;border-radius:9px;padding:9px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">Зберегти і обрати</button>
      </div>
    </div>
    <div id="bbean-pick"></div>
  </div>
</div>
