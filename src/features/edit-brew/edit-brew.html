<!-- OVERLAYS -->
<!-- EDIT BREW OVERLAY -->
<div class="overlay" id="ov-edit-brew" onclick="if(event.target===this)closeEditBrew()">
  <div class="sheet" style="max-height:92vh;overflow-y:auto;padding-bottom:32px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
      <div style="font-size:16px;font-weight:700;color:var(--txt)">Редагувати рецепт</div>
      <button onclick="closeEditBrew()" style="background:none;border:none;color:var(--txt3);cursor:pointer;font-size:22px;line-height:1;padding:4px"><i class="ti ti-x"></i></button>
    </div>

    <!-- Оцінка -->
    <div class="notes-block" style="margin-bottom:16px">
      <div class="lbl" style="margin-bottom:8px" data-i18n="rate_title">Оцінка</div>
      <div class="rating-block" style="margin-bottom:0">
        <div class="rating-big" id="edit-rate-num" style="font-size:52px">8.0</div>
        <div class="rating-sub" data-i18n="rate_cup_sub">оцінка чашки</div>
        <input type="range" class="rslider" min="1" max="10" step="0.1" value="8" id="edit-rate-slider" style="width:100%"
          oninput="var v=parseFloat(this.value);document.getElementById('edit-rate-num').textContent=v.toFixed(1);applyRatingColor('edit-rate-num','edit-rate-slider',v)">
        <div class="rrange"><span data-i18n="rate_bad">Погано</span><span data-i18n="rate_perfect">Ідеально</span></div>
      </div>
    </div>

    <!-- Дата та час -->
    <div class="notes-block" style="margin-bottom:16px">
      <div class="lbl" style="margin-bottom:6px">Дата та час</div>
      <input type="datetime-local" id="edit-datetime" class="notes-inp" style="padding:10px;font-size:14px;font-family:var(--mono);font-weight:600">
    </div>

    <!-- Час проливу (тільки для еспресо-рецептів) -->
    <div class="notes-block" id="edit-esp-time-block" style="margin-bottom:16px;display:none">
      <div class="lbl" style="margin-bottom:6px">Час проливу (с)</div>
      <input type="number" id="edit-esp-time" min="0" max="180" class="notes-inp" style="padding:10px;font-size:15px;font-family:var(--mono);font-weight:700;text-align:center" readonly onclick="openNumPad('edit-esp-time','edit-esp-time')">
    </div>

    <!-- Доза / Ratio / Темп -->
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px">
      <div class="notes-block" style="margin-bottom:0">
        <div class="lbl" style="margin-bottom:6px" data-i18n="param_esp_dose">Доза (г)</div>
        <input type="number" id="edit-dose" min="1" max="100" step="0.1" class="notes-inp" style="padding:10px;font-size:15px;font-family:var(--mono);font-weight:700;text-align:center">
      </div>
      <div class="notes-block" style="margin-bottom:0">
        <div class="lbl" style="margin-bottom:6px" data-i18n="brew_ratio_label_full">Ratio 1:</div>
        <input type="number" id="edit-ratio" min="1" max="30" step="0.1" class="notes-inp" style="padding:10px;font-size:15px;font-family:var(--mono);font-weight:700;text-align:center">
      </div>
      <div class="notes-block" style="margin-bottom:0">
        <div class="lbl" style="margin-bottom:6px">Темп (°C)</div>
        <input type="number" id="edit-temp" min="50" max="100" step="1" class="notes-inp" style="padding:10px;font-size:15px;font-family:var(--mono);font-weight:700;text-align:center">
      </div>
    </div>

    <!-- Кроки (вливи/паузи) -->
    <div class="notes-block" style="margin-bottom:16px" id="edit-steps-block">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div class="lbl">Кроки заварювання</div>
        <button onclick="editAddStep()" style="background:var(--card-lo);border:1px solid var(--line-soft);color:var(--copper-lt);border-radius:8px;padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit"><i class="ti ti-plus"></i> Додати</button>
      </div>
      <div id="edit-steps-list" style="display:flex;flex-direction:column;gap:6px"></div>
    </div>

    <!-- Колесо смаку/аромату -->
    <div class="notes-block" style="margin-bottom:16px">
      <div class="lbl" style="margin-bottom:8px">Смак та аромат</div>
      <div id="edit-taste-mount"></div>
    </div>

    <!-- Нотатки -->
    <div class="notes-block" style="margin-bottom:20px">
      <div class="lbl" style="margin-bottom:8px">Нотатки</div>
      <textarea class="notes-inp" id="edit-notes" placeholder="Враження, баланс, тіло..." rows="3"></textarea>
    </div>

    <button class="save-btn" onclick="saveEditBrew()"><i class="ti ti-check"></i> Зберегти зміни</button>
  </div>
</div>
