<div class="overlay" id="ov-bean" onclick="if(event.target===this)closeOv('ov-bean')">
  <div class="sheet">
    <div class="sheet-title" id="bean-sheet-title">Додати пачку</div>

    <!-- Назва кофе з автодоповненням -->
    <div class="ac-wrap" id="ac-bn-name-wrap">
      <input class="sfi" id="bn-name" placeholder="Назва кави" autocomplete="off"
        oninput="acSuggest('bn-name','beanNames')" onfocus="acSuggest('bn-name','beanNames')" style="margin-bottom:0">
      <div class="ac-drop" id="ac-bn-name"></div>
    </div>

    <!-- Обсмажувач з автодоповненням -->
    <div class="ac-wrap" id="ac-bn-roast-wrap" style="margin-top:10px">
      <input class="sfi" id="bn-roast" placeholder="Обсмажувач" autocomplete="off"
        oninput="acSuggest('bn-roast','roasters')" onfocus="acSuggest('bn-roast','roasters')" style="margin-bottom:0">
      <div class="ac-drop" id="ac-bn-roast"></div>
    </div>

    <!-- Додаткові поля -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
      <div>
        <div class="field-lbl" style="margin-bottom:4px">Країна</div>
        <div class="ac-wrap" id="ac-bn-country-wrap">
          <input class="sfi" id="bn-country" placeholder="Ефіопія" autocomplete="off"
            oninput="acSuggest('bn-country','countries')" onfocus="acSuggest('bn-country','countries')" style="margin-bottom:0">
          <div class="ac-drop" id="ac-bn-country"></div>
        </div>
      </div>
      <div>
        <div class="field-lbl" style="margin-bottom:4px">Обробка</div>
        <select class="sfi" id="bn-process" style="margin-bottom:0">
          <option value="">—</option>
          <option>Washed</option><option>Natural</option><option>Honey</option>
          <option>Anaerobic</option><option>Carbonic Maceration</option><option>Wet-Hulled</option>
        </select>
      </div>
    </div>

    <div style="margin-top:8px">
      <div class="field-lbl" style="margin-bottom:4px">Профіль обсмаження</div>
      <select class="sfi" id="bn-roastprofile" style="margin-bottom:0">
        <option value="">— визначати автоматично по методу —</option>
        <option value="filter">Фільтр</option>
        <option value="espresso">Еспресо</option>
        <option value="omni">Омні</option>
      </select>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
      <div>
        <div class="field-lbl" style="margin-bottom:4px">Ферма / регіон</div>
        <input class="sfi" id="bn-farm" placeholder="Yirgacheffe" style="margin-bottom:0">
      </div>
      <div>
        <div class="field-lbl" style="margin-bottom:4px">Бали SCA</div>
        <input class="sfi" id="bn-score" type="number" min="50" max="100" step="0.1" placeholder="87.5" style="margin-bottom:0">
      </div>
    </div>

    <div style="margin-top:8px">
      <div class="field-lbl" style="margin-bottom:4px">Дескриптори</div>
      <input class="sfi" id="bn-desc" placeholder="Чорниця, жасмин, цитрус..." style="margin-bottom:0">
    </div>

    <div style="margin-top:8px">
      <div class="field-lbl" style="margin-bottom:5px">Вага пачки (г)</div>
      <input class="sfi" id="bn-weight" type="number" inputmode="numeric" pattern="[0-9]*" value="250" min="1" max="5000" placeholder="250" style="font-size:16px;font-weight:700">
    </div>

    <div class="sbtns"><button class="btn-c" onclick="closeOv('ov-bean')">Скасувати</button><button class="btn-s" id="bean-save-btn" onclick="addBean()">Додати</button></div>
  </div>
</div>
